[project]
name = "adaptive-rag-engine"
version = "1.0.0"
description = "A self-correcting, hybrid-retrieval Adaptive RAG system built on free, open-source infrastructure (Groq, HuggingFace, FAISS, LangGraph)."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Adaptive RAG Engine Contributors" }
]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["backend", "frontend", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
    "N",   # pep8-naming
]
ignore = ["B008"]  # allow FastAPI's Depends(...) as a default argument

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["E501"]  # descriptive test names and inline fixture data legitimately run long

[tool.ruff.lint.isort]
known-first-party = ["backend", "frontend"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
ignore_missing_imports = true
exclude = ["tests/", "frontend/"]

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --cov=backend --cov-report=term-missing"
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "unit: fast, isolated unit tests",
    "integration: tests that exercise multiple components together",
]

[tool.coverage.run]
source = ["backend"]
omit = ["*/tests/*", "*/__init__.py"]
